[project]
name = "parallelalgorithms"
version = "0.1.0"
description = "Лабораторные работы по курсу «Параллельные алгоритмы»: блочный метод Холецкого через блочные скалярные произведения"
readme = "README.md"
authors = [
    { name = "DmitryDol", email = "ddimapalih@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pypandoc-binary>=1.17",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
